<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f4ef">
<title>Bez připojení · Kantýna</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; }
  body {
    min-height: 100%; margin: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));
    background: #f8f4ef; color: #1a1208; text-align: center;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Se snímkem objednávky je obsah delší než displej: začni nahoře a roluj. */
  body.has-order { justify-content: flex-start; }
  .tile {
    width: 72px; height: 72px; border-radius: 20px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #F59E0B, #EA580C);
    box-shadow: 0 10px 24px -10px rgba(234,88,12,0.55);
  }
  .has-order .tile { width: 52px; height: 52px; border-radius: 15px; }
  .has-order .tile svg { width: 28px; height: 28px; }
  h1 { margin: 6px 0 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  p { margin: 0; max-width: 300px; font-size: 14px; line-height: 1.5; color: #7a6552; }
  a {
    margin-top: 8px; padding: 11px 22px; border-radius: 999px;
    background: linear-gradient(135deg, #F59E0B, #EA580C); color: #fff;
    font-size: 14px; font-weight: 600; text-decoration: none;
    box-shadow: 0 4px 12px -4px rgba(245,158,11,0.4);
  }
  a:focus-visible { outline: 2px solid rgba(245,158,11,0.7); outline-offset: 2px; }

  #order { width: 100%; max-width: 460px; margin-top: 14px; text-align: left; }
  .order-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 4px 8px; }
  .order-head strong { font-size: 15px; }
  .order-head span { font-size: 12px; color: #7a6552; white-space: nowrap; }
  .note { padding: 0 4px 10px; font-size: 12px; color: #9b8474; max-width: none; }
  .dept {
    margin-bottom: 12px; border-radius: 18px; overflow: hidden;
    background: rgba(255,255,255,0.82); border: 1px solid rgba(255,255,255,0.72);
    box-shadow: 0 14px 40px -16px rgba(26,18,8,0.10), 0 2px 8px -2px rgba(26,18,8,0.06);
  }
  .dept h2 {
    margin: 0; padding: 10px 14px; font-size: 13px; font-weight: 700;
    background: rgba(26,18,8,0.04); border-bottom: 1px solid rgba(26,18,8,0.06);
  }
  .row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; border-bottom: 1px solid rgba(26,18,8,0.06); }
  .row:last-child { border-bottom: 0; }
  .row div { flex: 1; min-width: 0; }
  .row b { display: block; font-size: 14px; font-weight: 600; }
  .row small { display: block; margin-top: 2px; font-size: 12.5px; line-height: 1.4; color: #7a6552; }
  .row em { flex: none; font-style: normal; font-size: 13px; font-weight: 700; white-space: nowrap; }
</style>
</head>
<body>
  <div class="tile" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 2l20 20M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 5.2-2.7M19 12.9a10 10 0 0 0-2-1.5M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8a15 15 0 0 0-11.3-3.7M12 20h.01"/>
    </svg>
  </div>
  <h1>Bez připojení</h1>
  <p>Kantýna se nedostane na server. Zkontrolujte Wi‑Fi nebo data, stránka se po obnovení spojení načte sama.</p>
  <a href="/">Zkusit znovu</a>
  <section id="order" hidden aria-label="Poslední načtená objednávka"></section>
  <script>
    // Tahle stránka se zobrazuje na adrese, kterou uživatel chtěl otevřít.
    addEventListener("online", function () { location.reload(); });

    // Poslední načtený stav dnešní objednávky; ukládá ho appka do localStorage
    // (app/components/order/offline-snapshot.ts). Jen ke čtení a jen dnešní —
    // včerejší objednávka by tu spíš mátla.
    (function () {
      var snap;
      try { snap = JSON.parse(localStorage.getItem("offlineOrderSnapshot") || "null"); } catch (e) { return; }
      if (!snap || snap.v !== 1 || !Array.isArray(snap.departments) || snap.departments.length === 0) return;
      var today = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Prague" }).format(new Date());
      if (snap.date !== today) return;

      function el(tag, text, className) {
        var node = document.createElement(tag);
        if (text != null) node.textContent = text;
        if (className) node.className = className;
        return node;
      }

      var root = document.getElementById("order");
      var head = el("div", null, "order-head");
      head.appendChild(el("strong", String(snap.dayLabel || "Dnešní objednávka")));
      head.appendChild(el("span", (snap.sent ? "Odesláno · " : "") + (Number(snap.total) || 0) + " Kč"));
      root.appendChild(head);

      var saved = new Date(snap.savedAt);
      var time = isNaN(saved) ? "" : " v " + saved.toLocaleTimeString("cs-CZ", { timeZone: "Europe/Prague", hour: "2-digit", minute: "2-digit" });
      root.appendChild(el("p", "Stav naposledy načtený" + time + ". Mezitím se mohl změnit.", "note"));

      snap.departments.forEach(function (dept) {
        var card = el("div", null, "dept");
        card.appendChild(el("h2", String(dept.label || "")));
        (dept.rows || []).forEach(function (row) {
          var line = el("div", null, "row");
          var body = el("div");
          body.appendChild(el("b", String(row.name || "—")));
          if (row.items) body.appendChild(el("small", String(row.items)));
          line.appendChild(body);
          if (Number(row.price) > 0) line.appendChild(el("em", Number(row.price) + " Kč"));
          card.appendChild(line);
        });
        root.appendChild(card);
      });

      root.hidden = false;
      document.body.classList.add("has-order");
    })();
  </script>
</body>
</html>

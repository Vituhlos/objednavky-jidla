<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f4ef">
<title>Bez připojení · Kantýna</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
    background: #f8f4ef; color: #1a1208; text-align: center;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .tile {
    width: 72px; height: 72px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #F59E0B, #EA580C);
    box-shadow: 0 10px 24px -10px rgba(234,88,12,0.55);
  }
  h1 { margin: 6px 0 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  p { margin: 0; max-width: 300px; font-size: 14px; line-height: 1.5; color: #7a6552; }
  a {
    margin-top: 8px; padding: 11px 22px; border-radius: 999px;
    background: linear-gradient(135deg, #F59E0B, #EA580C); color: #fff;
    font-size: 14px; font-weight: 600; text-decoration: none;
    box-shadow: 0 4px 12px -4px rgba(245,158,11,0.4);
  }
  a:focus-visible { outline: 2px solid rgba(245,158,11,0.7); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="tile" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 2l20 20M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 5.2-2.7M19 12.9a10 10 0 0 0-2-1.5M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8a15 15 0 0 0-11.3-3.7M12 20h.01"/>
    </svg>
  </div>
  <h1>Bez připojení</h1>
  <p>Kantýna se nedostane na server. Zkontrolujte Wi‑Fi nebo data, stránka se po obnovení spojení načte sama.</p>
  <a href="/">Zkusit znovu</a>
  <script>
    // Tahle stránka se zobrazuje na adrese, kterou uživatel chtěl otevřít.
    addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>

name: Tests

# Spouští se sám u pull requestů a zároveň se dá zavolat z jiného workflow.
# `docker.yml` ho volá jako podmínku publikace, takže se image nikdy nevydá
# z kódu, který neprošel testy — a to ani při releasu z tagu.
on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stejná major verze jako v Dockerfile, ať se testy nepotkají s jiným
      # runtimem, než na kterém pak appka běží.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
